# nice!view screens on both halves (zmk-nice-oled `nice_epaper` shield = nice!view support).
# Options: https://github.com/mctechnology17/zmk-nice-oled#configuration
# Settings here apply to both halves. The picture is chosen per half in build.yaml (cmake-args).
#
# Animated pictures, CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_<NAME>=y with CAT=n
# (CAT is on by default; checked in the order HEAD > CAT > SPACEMAN > POKEMON, then GEM):
#   CAT, GEM, HEAD, SPACEMAN, POKEMON
# Still picture: CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n plus optionally
#   CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y or ..._VIP_MARCOS=y
