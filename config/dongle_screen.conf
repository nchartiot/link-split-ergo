# YADS dongle screen options, see https://github.com/janpfischer/zmk-dongle-screen#configuration-options
# Set to y only if your Prospector has the APDS9960 ambient light sensor fitted.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
# GUI modifier icon: 0 = macOS, 1 = Linux, 2 = Windows
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=0
# The bongo cat (yads_bongo_cat shield) takes the space of the USB/BLE output indicator.
CONFIG_DONGLE_SCREEN_OUTPUT_ACTIVE=n
