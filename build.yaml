# This file generates the GitHub Actions matrix.
# See https://zmk.dev/docs/user-setup#customization for details.
---
include:
  # ---------------------------------------------------------------
  # Prospector dongle setup: dongle is central, both halves are peripherals
  # ---------------------------------------------------------------
  # Default dongle screen: YADS + bongo cat (config/dongle_screen.conf).
  - board: seeeduino_xiao_ble
    shield: link_dongle dongle_screen yads_bongo_cat
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: link_dongle_yads
  # Alternative: original Prospector screen (config/prospector_adapter.conf)
  - board: seeeduino_xiao_ble
    shield: link_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: link_dongle_prospector
  # nice!view pictures per half: see config/nice_epaper.conf for the options
  - board: link_left
    shield: nice_epaper
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
      -DCONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
      -DCONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
    artifact-name: link_left_peripheral
  - board: link_right
    shield: nice_epaper
    cmake-args: >-
      -DCONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
      -DCONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
    artifact-name: link_right

  # ---------------------------------------------------------------
  # Standalone setup (no dongle): left half is central
  # Pair with the same link_right firmware as above.
  # ---------------------------------------------------------------
  - board: link_left
    shield: nice_epaper
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: link_left_central_studio

  # ---------------------------------------------------------------
  # Settings reset (flash before switching between setups)
  # ---------------------------------------------------------------
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset_dongle
  # Halves: instead of the settings_reset shield (which has no keymap), use the
  # real keymap as a standalone, BLE-off build that wipes settings on every boot.
  # The &bootloader keys keep working locally, so no reset button is needed:
  # left = Lower + top-left key, right = Raise + top-right key.
  - board: link_left
    cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_BLE=n -DCONFIG_SETTINGS=y -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: settings_reset_link_left
  - board: link_right
    cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_BLE=n -DCONFIG_SETTINGS=y -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: settings_reset_link_right
